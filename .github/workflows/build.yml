name: Build Vidya APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://inquisitive-horse-15d927.netlify.app
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/speech-recognition@7
          mkdir -p www/icons
          curl -fsSL "$SITE_URL/" -o www/index.html
          curl -fsSL "$SITE_URL/manifest.json" -o www/manifest.json
          curl -fsSL "$SITE_URL/icons/icon-192.png" -o www/icons/icon-192.png
          npx cap init Vidya com.boss.vidya --web-dir www
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vidya-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
